<!DOCTYPE html>
<html>
<head>
    <title>ePaper Clock Controller</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #status { margin-top: 20px; color: #555; }
    </style>
</head>
<body>
    <h1>ePaper Clock Sync</h1>
    <button id="connect">Connect & Sync Data</button>
    <div id="status">Click the button to pair with "ePaper-Clock"</div>

    <script>
        const API_KEY = 'f440deda74c2ea5ea493929a547bf7';
        const CITY = 'Bengaluru,IN';

        // BLE UUIDs from the Arduino sketch
        const SERVICES = {
            CTS: 0x1805,
            ESS: 0x181A
        };
        const CHARS = {
            TIME: 0x2A2B,
            TEMP: 0x2A6E,
            HUMID: 0x2A6F,
            COND: 'eca8f8b0-eab7-4ab3-9b0b-e8e3a0e50b21',
            CITY: 'eca8f8b0-eab7-4ab3-9b0b-e8e3a0e50b22'
        };

        document.getElementById('connect').addEventListener('click', async () => {
            try {
                const status = document.getElementById('status');
                status.innerText = "Requesting Bluetooth device...";

                const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ePaper-Clock' }],
                    optionalServices: [SERVICES.CTS, SERVICES.ESS]
                });

                const server = await device.gatt.connect();
                status.innerText = "Connected! Fetching weather...";

                // 1. Fetch Weather
                const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${CITY}&appid=${API_KEY}&units=metric`);
                const data = await response.json();

                // 2. Sync Time (CTS - 10 bytes)
                const ctsService = await server.getPrimaryService(SERVICES.CTS);
                const timeChar = await ctsService.getCharacteristic(CHARS.TIME);
                const now = new Date();
                const timeData = new Uint8Array([
                    now.getFullYear() & 0xFF, now.getFullYear() >> 8,
                    now.getMonth() + 1, now.getDate(),
                    now.getHours(), now.getMinutes(), now.getSeconds(),
                    now.getDay() === 0 ? 7 : now.getDay(), // 1=Mon...7=Sun
                    0, 1 // fractions, reason
                ]);
                await timeChar.writeValue(timeData);

                // 3. Sync Weather (ESS)
                const essService = await server.getPrimaryService(SERVICES.ESS);
                
                // Temp (int16, 0.01°C)
                const tempChar = await essService.getCharacteristic(CHARS.TEMP);
                const tempVal = Math.round(data.main.temp * 100);
                await tempChar.writeValue(new Int16Array([tempVal]));

                // Humidity (uint16, 0.01%)
                const humidChar = await essService.getCharacteristic(CHARS.HUMID);
                const humidVal = Math.round(data.main.humidity * 100);
                await humidChar.writeValue(new Uint16Array([humidVal]));

                // Condition (uint8 custom)
                const condChar = await essService.getCharacteristic(CHARS.COND);
                const condMap = { 'Clear': 0, 'Clouds': 2, 'Rain': 3, 'Snow': 4, 'Thunderstorm': 5, 'Drizzle': 3, 'Mist': 6 };
                const cond = condMap[data.weather[0].main] || 1; 
                await condChar.writeValue(new Uint8Array([cond]));

                // City Name (UTF-8)
                const cityChar = await essService.getCharacteristic(CHARS.CITY);
                const cityName = new TextEncoder().encode(data.name.substring(0, 20));
                await cityChar.writeValue(cityName);

                status.innerText = "Sync Complete! Clock will now update.";
                device.gatt.disconnect();

            } catch (error) {
                console.error(error);
                document.getElementById('status').innerText = "Error: " + error.message;
            }
        });
    </script>
</body>
</html>
